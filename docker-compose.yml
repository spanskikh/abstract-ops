services:
  auditor:
    build: .
    image: abstract-ops-auditor:latest
    pull_policy: never
    environment:
      AUDIT_DB_PATH: /app/data/abstract_audit.duckdb
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
    volumes:
      - ./data:/app/data
    networks:
      - default
      - sandbox_net
    mem_limit: 1g

networks:
  sandbox_net:
    external: true
    name: sandbox-init_default
